seed: 42
target: preDM2            # <- EDIT: name of your label column (0/1)
exclude: [SEQN, grp]          # identifiers / group labels: never used as features
paths:
  train: data/train.csv          # <- your 70% split (numeric features only)
  val: data/val.csv              # <- 15%
  test: data/test.csv            # <- 15%
  feature_spec: data/feature_spec.csv
  models: models
  results: results
model:
  calibration: isotonic          # isotonic | platt
  min_features_for_score: 20      # below this -> "insufficient data"
llm:
  provider: openai_compatible
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  max_workers: 1
  min_interval_sec: 4
  system_model: openai/gpt-oss-120b
  sim_model: openai/gpt-oss-20b
  judge_model: openai/gpt-oss-120b
  token_headroom: 2000
  reasoning_effort: low